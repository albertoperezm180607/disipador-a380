<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disipador A380 HPDC</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#15212e;--muted:#5b6876;--line:#c9d1da;--accent:#1a5d8f;--sans:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--panel:#18212b;--ink:#e3e9ef;--muted:#93a1af;--line:#2c3947;--accent:#6fb1e3;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:1.05rem;margin:0;font-weight:600}
.sub{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 .8rem var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.stage{position:relative;flex:1;min-height:300px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;top:10px;font:400 .72rem var(--mono);color:var(--muted)}
table{position:absolute;right:10px;bottom:10px;font:400 .7rem var(--mono);background:var(--panel);border-collapse:collapse}
td{border:1px solid var(--line);padding:3px 7px}td:first-child{color:var(--muted);text-transform:uppercase}
@media (max-width:520px){table{display:none}}
</style>
</head>
<body>
<header>
<div><h1>Disipador de calor · Aleación A380 (HPDC)</h1>
<div class="sub">120 × 80 × 35 mm · 12 aletas · base 6 mm · 4 × M4</div></div>
<div class="bar">
<button id="iso" aria-pressed="true">Isométrica</button><button id="alz">Alzado</button><button id="pla">Planta</button><button id="per">Perfil izq.</button><button id="inf">Inferior</button><button id="ari" aria-pressed="true">Aristas</button>
</div>
</header>
<div class="stage" id="stage">
<div class="hint">Arrastra para girar · pellizca para ampliar</div>
<table><tr><td>Pieza</td><td>Disipador A380</td></tr><tr><td>Proceso</td><td>HPDC cámara fría</td></tr><tr><td>Volumen</td><td>99,2 cm³</td></tr><tr><td>Masa</td><td>≈ 272 g</td></tr><tr><td>Tolerancia</td><td>ISO 8062 DCTG 6</td></tr></table>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Geometría (mm): base 120x80x6 con biseles inferiores 1x45° y 4 taladros Ø3,3; 12 aletas de 1,8 (raíz) a 1,2 (punta) y 29 de alto
const L=120,W=80,TB=6,H=35,TR=1.8,TT=1.2,N=12,CH=1,R=1.65,pitch=(L-TR)/(N-1);
const holes=[];for(const x of[-L/2+TR/2+2.5*pitch,-L/2+TR/2+8.5*pitch])for(const y of[-25,25])holes.push([x,y]);
const parts=[];
function rectShape(hw,hh){const s=new THREE.Shape();s.moveTo(-hw,-hh);s.lineTo(hw,-hh);s.lineTo(hw,hh);s.lineTo(-hw,hh);s.closePath();
 for(const[x,y]of holes){const p=new THREE.Path();p.absarc(x,y,R,0,Math.PI*2,true);s.holes.push(p)}return s}
// base superior (z = 1..6)
let g=new THREE.ExtrudeGeometry(rectShape(L/2,W/2),{depth:TB-CH,bevelEnabled:false,curveSegments:24});g.translate(0,0,CH);parts.push(g);
// franja biselada (z = 0..1)
const b=L/2-CH,c=W/2-CH,pos=[];
const q=(a,b2,c2,d)=>pos.push(...a,...b2,...c2,...a,...c2,...d);
const lo=[[-b,-c,0],[b,-c,0],[b,c,0],[-b,c,0]],hi=[[-L/2,-W/2,CH],[L/2,-W/2,CH],[L/2,W/2,CH],[-L/2,W/2,CH]];
for(let i=0;i<4;i++){const j=(i+1)%4;q(lo[i],lo[j],hi[j],hi[i])}
g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();parts.push(g);
g=new THREE.ShapeGeometry(rectShape(b,c),24);g.rotateX(Math.PI);parts.push(g);
for(const[x,y]of holes){g=new THREE.CylinderGeometry(R,R,CH,24,1,true);g.rotateX(Math.PI/2);g.translate(x,y,CH/2);g.scale(1,1,1);parts.push(g)}
// aletas
for(let i=0;i<N;i++){const x=-L/2+TR/2+i*pitch,s=new THREE.Shape();
 s.moveTo(x-TR/2,TB);s.lineTo(x+TR/2,TB);s.lineTo(x+TT/2,H);s.lineTo(x-TT/2,H);s.closePath();
 g=new THREE.ExtrudeGeometry(s,{depth:W,bevelEnabled:false});g.rotateX(Math.PI/2);g.translate(0,W/2,0);parts.push(g)}
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
const scene=new THREE.Scene(),root=new THREE.Group();root.position.z=-H/2;scene.add(root);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-2000,5000);cam.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));
const d1=new THREE.DirectionalLight(0xffffff,1.6);d1.position.set(200,-300,400);scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,.6);d2.position.set(-300,200,100);scene.add(d2);
const mat=new THREE.MeshStandardMaterial({color:0x2a2d33,metalness:.35,roughness:.6,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const emat=new THREE.LineBasicMaterial({color:0x8fa3b8}),edges=[];
for(const p of parts){root.add(new THREE.Mesh(p,mat));const e=new THREE.LineSegments(new THREE.EdgesGeometry(p,25),emat);edges.push(e);root.add(e)}
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;
const D=330,V={iso:[1,-1.2,.9],alz:[0,-1,0],pla:[0,-0.001,1],per:[-1,0,0],inf:[0,-0.001,-1]};let anim=null;
function go(id){const to=new THREE.Vector3(...V[id]).normalize().multiplyScalar(D);anim={from:cam.position.clone(),to,t0:performance.now()};ctl.target.set(0,0,0);
 for(const k in V)document.getElementById(k).setAttribute("aria-pressed",k===id)}
for(const k in V)document.getElementById(k).onclick=()=>go(k);
const ab=document.getElementById("ari");ab.onclick=()=>{const v=!edges[0].visible;edges.forEach(e=>e.visible=v);ab.setAttribute("aria-pressed",v)};
cam.position.copy(new THREE.Vector3(...V.iso).normalize().multiplyScalar(D));
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);const a=w/h;let hh=60;if(a*hh<85)hh=85/a;
 cam.left=-hh*a;cam.right=hh*a;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
renderer.setAnimationLoop(t=>{if(anim){const k=Math.min(1,(t-anim.t0)/500),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.position.lerpVectors(anim.from,anim.to,e);if(k>=1)anim=null}
 ctl.update();renderer.render(scene,cam)});
</script>
</body>
</html>
